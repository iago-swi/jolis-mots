<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Jolis Mots – quiz</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<style>
body{margin:0}
a{color:#566070}a:hover{color:#1A2230}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4EF; color: #1A2230; font-family: 'EB Garamond', Georgia, serif; display: flex; flex-direction: column">

<header style="display: flex; justify-content: space-between; align-items: baseline; padding: 30px 28px 0">
<span style="font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #566070">Quiz</span>
<span style="font-size: 16px; font-style: italic; color: #566070">Question 2 sur 3</span>
</header>

<div aria-hidden="true" style="display: flex; gap: 6px; padding: 16px 28px 0">
<div style="flex: 1 1 0; height: 2px; background: #1A2230"></div>
<div style="flex: 1 1 0; height: 2px; background: {{accent}}"></div>
<div style="flex: 1 1 0; height: 2px; background: #C3C8BE"></div>
</div>

<main style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 40px 28px 0; display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0; font-size: 12px; font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase; color: #566070">Quel mot correspond à cette définition ?</h1>
<p style="margin: 0; font-size: 30px; line-height: 1.22; font-weight: 500">Se promener sans but précis, flâner.</p>
<p style="margin: -6px 0 0; font-size: 18px; font-style: italic; color: #566070">verbe</p>

<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px">
<sc-for list="{{choix}}" as="c" hint-placeholder-count="4">
<button onClick="{{c.pick}}" style="height: 58px; padding: 0 20px; border-width: 1px; border-style: solid; border-color: {{c.bd}}; border-radius: 12px; background: {{c.bg}}; color: {{c.fg}}; font-family: inherit; font-size: 22px; text-align: left; cursor: pointer; display: flex; align-items: center; justify-content: space-between">
<span style="text-decoration: {{c.deco}}">{{c.mot}}</span>
<sc-if value="{{c.juste}}" hint-placeholder-val="{{ false }}">
<svg role="img" aria-label="Bonne réponse" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
<sc-if value="{{c.faux}}" hint-placeholder-val="{{ false }}">
<svg role="img" aria-label="Mauvaise réponse" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg>
</sc-if>
</button>
</sc-for>
</div>

<sc-if value="{{bonneReponse}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 8px; display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 22px; font-weight: 600">Juste.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.4; color: #566070">Vu il y a un instant, chez Sylvain Tesson. Il reviendra dans quelques jours.</p>
</div>
</sc-if>
<sc-if value="{{mauvaiseReponse}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: 8px; display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 22px; font-weight: 600">C’était <span style="font-style: italic">baguenauder</span>.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.4; color: #566070">Il reviendra demain, jusqu’à ce qu’il tienne.</p>
</div>
</sc-if>
</main>

<div style="padding: 14px 28px 18px; min-height: 52px">
<sc-if value="{{repondu}}" hint-placeholder-val="{{ false }}">
<button onClick="{{suite}}" style="width: 100%; height: 52px; border: none; border-radius: 26px; background: #1A2230; color: #F3F4EF; font-family: inherit; font-size: 19px; cursor: pointer">Question suivante</button>
</sc-if>
</div>

<nav aria-label="Navigation principale" style="display: flex; border-top: 1px solid #D5D8D0; height: 66px; flex-shrink: 0">
<a href="Main.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #566070; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 5.5c2.5-1 5.5-1 8 .5 2.5-1.5 5.5-1.5 8-.5v13c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"></path><path d="M12 6v13"></path></svg>
<span>Mot</span>
</a>
<a href="Quiz.dc.html" aria-current="page" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #1A2230; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; box-shadow: inset 0 2px 0 {{accent}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M8.5 12.2l2.4 2.4 4.6-5"></path></svg>
<span>Quiz</span>
</a>
<a href="Recueil.dc.html" style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #566070; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"></path></svg>
<span>Recueil</span>
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B8321E","options":["#B8321E","#1F4E79","#2F5D50","#6B3A5B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const choisi = st.choisi ?? null;
const bonne = "baguenauder";
const liste = [
{ id: "acagnarder", mot: "S’acagnarder" },
{ id: "baguenauder", mot: "Baguenauder" },
{ id: "rapetasser", mot: "Rapetasser" },
{ id: "comburer", mot: "Comburer" }
];
const repondu = choisi !== null;
const choix = liste.map((c) => {
const estBonne = c.id === bonne;
const estChoisi = c.id === choisi;
let bg = "transparent", fg = "#1A2230", bd = "#1A2230", deco = "none";
if (repondu && estBonne) { bg = "#1A2230"; fg = "#F3F4EF"; }
else if (repondu && estChoisi) { bd = "#566070"; fg = "#566070"; deco = "line-through"; }
else if (repondu) { bd = "#C3C8BE"; fg = "#566070"; }
return {
mot: c.mot, bg: bg, fg: fg, bd: bd, deco: deco,
juste: repondu && estBonne,
faux: repondu && estChoisi && !estBonne,
pick: () => { if (!repondu) this.setState({ choisi: c.id }); }
};
});
return {
accent: this.props.accent ?? "#B8321E",
choix: choix,
repondu: repondu,
bonneReponse: repondu && choisi === bonne,
mauvaiseReponse: repondu && choisi !== bonne,
suite: () => this.setState({ choisi: null })
};
}
}
</script>
</body>
</html>
